<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Monitoring Bearing Spindle</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

    <header class="navbar">
        <h2>MONITORING VIBRASI & SPINDLE</h2>
        <div id="statusText" class="status-badge status-disconnected">DISCONNECTED</div>
    </header>

    <main class="container">
        <!-- Control Panel -->
        <section class="card control-panel">
            <button class="btn btn-connect" onclick="connectBLE()">Konek BLE</button>
            <button class="btn btn-start" onclick="sendCommand('START')">Start Data</button>
            <button class="btn btn-stop" onclick="sendCommand('STOP')">Stop Data</button>
            <button class="btn btn-download" onclick="downloadCSV()">Export CSV</button>
        </section>

        <!-- Configuration Panel (RPM & Limits) -->
        <section class="card config-panel" style="display: flex; gap: 15px; flex-wrap: wrap; margin-bottom: 20px;">
            <div>
                <label for="rpmInput"><b>Spindle RPM:</b></label><br>
                <input type="number" id="rpmInput" value="1500" style="padding: 5px; width: 100px;">
            </div>
            <div>
                <label for="warnInput"><b>Warn Limit (m/s²):</b></label><br>
                <input type="number" id="warnInput" value="1.8" step="0.1" style="padding: 5px; width: 100px;">
            </div>
            <div>
                <label for="dangerInput"><b>Danger Limit (m/s²):</b></label><br>
                <input type="number" id="dangerInput" value="4.5" step="0.1" style="padding: 5px; width: 100px;">
            </div>
        </section>

        <!-- Display RMS Overall -->
        <section class="card metric-card">
            <h3>NILAI RMS OVERALL</h3>
            <h1 id="rmsVal">0.00 M/S²</h1>
            <p id="alarmStatus" style="font-weight: bold; color: #00e676;">STATUS: NORMAL</p>
        </section>

        <!-- Grid Grafik -->
        <section class="chart-grid">
            <div class="card chart-box">
                <p class="chart-title">Waveform Z (Realtime)</p>
                <div class="canvas-wrapper">
                    <canvas id="chartWaveform"></canvas>
                </div>
            </div>

            <div class="card chart-box">
                <p class="chart-title">3-Axis Acceleration (X, Y, Z)</p>
                <div class="canvas-wrapper">
                    <canvas id="chart3Axis"></canvas>
                </div>
            </div>

            <div class="card chart-box">
                <p class="chart-title" id="spectrumHeader">SPECTRUM (PEAK: 0.00 M/S² @ 0.0 HZ)</p>
                <div class="canvas-wrapper">
                    <canvas id="chartFFT"></canvas>
                </div>
            </div>

            <div class="card chart-box">
                <p class="chart-title">RMS Trend History</p>
                <div class="canvas-wrapper">
                    <canvas id="chartRMS"></canvas>
                </div>
            </div>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
